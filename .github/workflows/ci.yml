name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # vitest 4 / vite 8 / jsdom 28 的 engines 要求 ^20.19 || ^22.12 || >=24，
        # Node 18 已 EOL 且与锁定的工具链不兼容（原矩阵含 18 会让该分支必然失败）
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4
        with:
          # 对照类测试会用 `git show bde5937:<file>` 取「修复前基线」，
          # 默认的浅克隆（depth 1）取不到该提交 → 必须完整历史
          fetch-depth: 0

      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 状态所有权检查
        run: node scripts/check-state-ownership.mjs

      - name: 全局函数冻结检查
        run: node scripts/check-global-functions.mjs

      - name: 构建 CSS
        run: npm run build-css

      - name: 构建 JS Bundle
        run: npm run build-bundle

      - name: 检查依赖版本
        run: node scripts/tools.mjs check-versions

      - name: 验证构建产物
        run: |
          echo "=== 验证构建产物 ==="
          test -f public/styles.css && echo "✅ styles.css 存在" || (echo "❌ styles.css 缺失" && exit 1)
          test -f public/app.bundle.js && echo "✅ app.bundle.js 存在" || (echo "❌ app.bundle.js 缺失" && exit 1)
          BUNDLE_SIZE=$(wc -c < public/app.bundle.js)
          echo "📦 app.bundle.js 大小: $BUNDLE_SIZE bytes"
          if [ "$BUNDLE_SIZE" -lt 100000 ]; then
            echo "❌ Bundle 体积异常偏小，可能构建不完整"
            exit 1
          fi
          # 完整性断言：bundle 文件头内嵌的模块清单必须与 app.js 声明的脚本一一对应。
          # 仅校验「文件存在 + 体积下限」无法发现部分源文件缺失导致的残缺 bundle，
          # 因此这里做集合比对（对应 scripts/build-bundle.js 的完整性闸门）。
          node -e '
            const fs = require("fs");
            const appJs = fs.readFileSync("public/app.js", "utf-8");
            const devOnly = new Set([
              "app/dev-tools/error-demo.js",
              "app/dev-tools/error-test.js",
              "app/dev-tools/error-system-test.js",
              "app/dev-tools/error-handling-examples.js",
            ]);
            const declared = new Set(
              [...appJs.matchAll(/"(app\/[^"]+\.js)"/g)]
                .map((m) => m[1])
                .filter((p) => !devOnly.has(p))
            );
            const bundle = fs.readFileSync("public/app.bundle.js", "utf-8");
            const block = bundle.match(/\/\*! @bundle-modules[\s\S]*?\*\//);
            if (!block) {
              console.error("❌ 未找到 @bundle-modules 模块清单，bundle 不可信");
              process.exit(1);
            }
            const embedded = new Set(
              block[0].split("\n").map((l) => l.replace(/^\s*\*\s?/, "").trim())
                .filter((l) => l.startsWith("app/"))
            );
            console.log(`🔎 声明脚本数: ${declared.size}, bundle 内嵌模块数: ${embedded.size}`);
            const missing = [...declared].filter((p) => !embedded.has(p));
            const extra = [...embedded].filter((p) => !declared.has(p));
            if (missing.length || extra.length) {
              if (missing.length) console.error(`❌ bundle 缺少 ${missing.length} 个模块: ${missing.join(", ")}`);
              if (extra.length) console.error(`❌ bundle 含 ${extra.length} 个未声明模块: ${extra.join(", ")}`);
              process.exit(1);
            }
            console.log("✅ Bundle 完整性校验通过");
          '
          echo "✅ 构建验证通过"
